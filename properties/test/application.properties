# suppress inspection "SpringBootApplicationProperties" for whole file
logging.file.path=/tmp/logs
logging.level.root=INFO
logging.level.org.springframework.security=WARN
server.tomcat.relaxed-query-chars=[,]
logging.level.org.apache.coyote.http11.Http11Processor=WARN
athena.token.header=Athena-Auth-Token
athena.token.expiration=604800
athena.resetPasswordToken.expiresMinutes=60
athena.solrServerUrl=http://localhost:8984/solr
athena.solrUser=solr
athena.solrPassword=
athena.messages.cache_seconds=-1
springdoc.api-docs.enabled=true
salt=test_profile_salt_not_a_secret_min_32_chars

athena.solr.core.name=concepts

spring.datasource-db.jdbc-url=jdbc:postgresql://localhost:5432/athena_db
spring.datasource-db.driver-class-name=org.postgresql.Driver
spring.datasource-db.username=ohdsi
spring.datasource-db.password=
spring.datasource-db.platform=postgresql
spring.datasource-db.hikari.idle-timeout=10000
spring.datasource-db.hikari.maximum-pool-size=10
spring.datasource-db.hikari.minimum-idle=5
spring.datasource-db.hikari.pool-name=AthenaDB-HikariPool

spring.datasource-v4.jdbc-url=jdbc:postgresql://localhost:5432/athena_cdm_v4_5
spring.datasource-v4.driver-class-name=org.postgresql.Driver
spring.datasource-v4.username=ohdsi
spring.datasource-v4.password=
spring.datasource-v4.platform=postgresql
spring.datasource-v4.hikari.idle-timeout=10000
spring.datasource-v4.hikari.maximum-pool-size=10
spring.datasource-v4.hikari.minimum-idle=5
spring.datasource-v4.hikari.pool-name=AthenaV4-HikariPool

spring.datasource-v5.jdbc-url=jdbc:postgresql://localhost:5432/athena_cdm_v5
spring.datasource-v5.driver-class-name=org.postgresql.Driver
spring.datasource-v5.username=ohdsi
spring.datasource-v5.password=
spring.datasource-v5.platform=postgresql
spring.datasource-v5.hikari.idle-timeout=10000
spring.datasource-v5.hikari.maximum-pool-size=10
spring.datasource-v5.hikari.minimum-idle=5
spring.datasource-v5.hikari.pool-name=AthenaV5-HikariPool

spring.datasource-v5-history.jdbc-url=jdbc:postgresql://localhost:5435/athena_cdm_v5_history
spring.datasource-v5-history.driver-class-name=org.postgresql.Driver
spring.datasource-v5-history.username=ohdsi
spring.datasource-v5-history.password=ohdsi
spring.datasource-v5-history.vocabulary.schema=vocabulary
spring.datasource-v5-history.platform=postgresql
spring.datasource-v5-history.hikari.idle-timeout=10000
spring.datasource-v5-history.hikari.maximum-pool-size=10
spring.datasource-v5-history.hikari.minimum-idle=5
spring.datasource-v5-history.hikari.pool-name=AthenaV5History-HikariPool

bundle.worker.enabled=false

athena-db.flyway.locations=db/migration/share,db/migration/athena
athena-v5.flyway.locations=db/migration/share,db/migration/v5
athena-v4.flyway.locations=db/migration/share,db/migration/v4
athena-v5-history.flyway.locations=db/migration/share,db/migration/v5_history

solr.limit.max=30000
solr.limit.min.query.characters=3
solr.limit.max.page.size=1000
solr.default.query.operator=AND

files.store.path=/opt/athena/files

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

athena.url=https://athena.example.org
athena.mail.notifier=Athena
athena.mail.admin=admin@admin.com

csv.separator=\t
csv.file.name.searched.concepts=Athena search.csv
saved.files.cleaner=0 0 1 * * *
saved.files.storage.days=7

cpt4.dir.v4=/opt/athena/addons/cpt4_4_5
cpt4.dir.v5=/opt/athena/addons/cpt4_5
delta.dir=/opt/athena/addons/delta

vocabularies.download.control.files.url=https://github.com/OHDSI/CommonDataModel/tree/v5.3.1
vocabularies.download.forum.url=http://forums.ohdsi.org/c/implementers
vocabularies.download.documentation.url=https://github.com/OHDSI/Athena/wiki/Download-Vocabularies
vocabularies.download.umls.url=https://uts.nlm.nih.gov/uts/login

athena.security.defaultRoles=ROLE_USER

build.number=@build.number@
build.id=@build.id@
project.version=@project.version@

spring.resources.cache.period = 1209600
