bundle.worker.enabled=${BUNDLE_WORKER_ENABLED:true}
bundle.worker.poll-delay=${BUNDLE_WORKER_POLL_DELAY:PT1S}
bundle.worker.heartbeat-interval=${BUNDLE_WORKER_HEARTBEAT_INTERVAL:PT30S}
bundle.worker.stale-after=${BUNDLE_WORKER_STALE_AFTER:PT5M}
bundle.worker.max-attempts=${BUNDLE_WORKER_MAX_ATTEMPTS:3}

athena-db.flyway.locations=db/migration/share,db/migration/athena
