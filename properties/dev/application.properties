# suppress inspection "SpringBootApplicationProperties" for whole file
server.port = 3010

logging.file.path=/tmp/logs
logging.level.root=INFO
logging.level.org.springframework.security=DEBUG
# Reverse proxies may decode %5B/%5D before forwarding a search URL. Accept only those
# additional query characters; malformed requests are still rejected by Tomcat. Parser
# failures happen before Spring MVC, so keep their expected client-error traces below INFO.
server.tomcat.relaxed-query-chars=[,]
logging.level.org.apache.coyote.http11.Http11Processor=WARN
api.time-tolerance=PT300H

# No server-to-server client is configured by default. This profile used to carry a "pd"
# client whose DSA public *and private* key were both committed here, which meant anyone
# with the repository could sign requests as that client. Both are gone, and the keypair
# should be treated as compromised wherever it was copied to.
#
# To exercise /api/s2s/** locally, generate your own pair and configure the public half:
#
#   api.clients.<id>.algorithm=SHA256withDSA
#   api.clients.<id>.public-key=<base64 X.509>
#
# The private half belongs on the calling client, not here. Setting it alongside
# api.debug-signatures=true makes the application log the correct signature for a rejected
# request, which is a local troubleshooting aid only -- such a line is enough to forge a
# request, so never configure it in a shared environment.
athena.token.header=Athena-Auth-Token
athena.token.expiration=604800
athena.async-auth-redirect=http://localhost:3010/auth/complete
athena.slo-url=https://localhost:8443/cas/logout
athena.resetPasswordToken.expiresMinutes=60
athena.solrServerUrl=http://localhost:8984/solr
athena.solrUser=solr
athena.solrPassword=
athena.messages.cache_seconds=0
springdoc.api-docs.enabled=true
salt=a_salt_for_hashing_should_be_long_and_random_min_32_chars

athena.solr.core.name=concepts

