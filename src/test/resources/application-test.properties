athena-db.flyway.locations=db/migration/share,db/migration/athena,testdata/db/migration/athena
athena-v5.flyway.locations=db/migration/share,db/migration/v5,testdata/db/migration/v5
athena-v5-history.flyway.locations=db/migration/share,db/migration/v5_history,testdata/db/migration/v5_history
files.store.path=${java.io.tmpdir}

# The delta-bundle scenarios assert the generated bundle contains the CPT4 utility
# files (cpt4.jar, readme.txt, cpt.bat, cpt.sh). Those live only in the deployment image
# under /opt/athena/addons, which the dev profile points at, so both scenarios failed from a
# clean checkout regardless of the code under test.
#
# These point at the *copied* fixtures under target/test-classes rather than the sources:
# ZipWriter.updateCPT4Utility writes a CSV entry into cpt4.jar, so pointing at
# src/test/resources would mutate a committed file on every run. Maven refreshes the copy
# each build, and `mvn clean` resets it.
cpt4.dir.v4=target/test-classes/testdata/addons/cpt4
cpt4.dir.v5=target/test-classes/testdata/addons/cpt4
# Not created on purpose: ZipWriter skips a delta directory that does not exist, and the
# delta.sql in the bundle is produced by the saver, not copied from here.
delta.dir=target/test-classes/testdata/addons/delta


logging.level.com.odysseusinc.athena.glue.LocalEnvironmentInitializer=DEBUG
